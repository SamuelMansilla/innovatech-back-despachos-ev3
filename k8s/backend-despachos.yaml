apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-back-despachos
  labels:
    app: back-despachos
spec:
  replicas: 2
  selector:
    matchLabels:
      app: back-despachos
  template:
    metadata:
      labels:
        app: back-despachos
    spec:
      containers:
      - name: back-despachos-container
        image: 251831776279.dkr.ecr.us-east-1.amazonaws.com/innovatech-back-despachos-repo:latest
        ports:
        - containerPort: 8081
        env:
        # Forzamos a Spring Boot a usar la base de datos interna de prueba H2
        - name: SPRING_PROFILES_ACTIVE
          value: "test"
---
apiVersion: v1
kind: Service
metadata:
  name: back-despachos-service
spec:
  type: ClusterIP
  selector:
    app: back-despachos
  ports:
  - protocol: TCP
    port: 8082
    targetPort: 8081